# Composite action that commits new versions
# ---
# Outputs:
# - oldVersion: The original version string before any changes
# - newVersion: The updated version string included in the commit.

name: Version

description: 'Composite action that updates the project version in pom.xml files via Maven and synchronizes the version string within README.md.'

inputs:
  version:
    description: 'New version (empty for SNAPSHOT/next patch)'
    required: false

outputs:
  oldVersion:
    description: "The original version string before any changes"
    value: ${{ env.oldVersion }}
  newVersion:
    description: "The updated version string included in the commit"
    value: ${{ env.newVersion }}

runs:
  using: "composite"
  steps:
    - name: Evaluate old version
      shell: bash
      run: |
        echo "oldVersion=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
    - name: Set next snapshot
      if: ${{ inputs.version == '' && !endsWith(env.oldVersion, '-SNAPSHOT') }}
      shell: bash
      run: |
        ./mvnw -B versions:set -DgenerateBackupPoms=false -DnextSnapshot=true
        echo "commitMsg=Next snapshot version" >> "$GITHUB_ENV"
    - name: Remove snapshot
      if: ${{ inputs.version == '' && endsWith(env.oldVersion, '-SNAPSHOT') }}
      shell: bash
      run: |
        ./mvnw -B versions:set -DgenerateBackupPoms=false -DremoveSnapshot=true
        echo "commitMsg=Remove snapshot version" >> "$GITHUB_ENV"
    - name: Set version
      if: ${{ inputs.version != '' }}
      shell: bash
      run: |
        ./mvnw -B versions:set -DgenerateBackupPoms=false -DnewVersion=${{ inputs.version }}
        echo "commitMsg=Set version to ${{ inputs.version }}" >> "$GITHUB_ENV"
    - name: Evaluate new version
      shell: bash
      run: |
        echo "newVersion=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
    - name: Update version in README
      uses: richardrigutins/replace-in-files@v3
      with:
        files: 'README.md'
        search-text: '${{ env.oldVersion }}'
        replacement-text: '${{ env.newVersion }}'
    - name: Commit changes
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "${{ env.commitMsg }}"
